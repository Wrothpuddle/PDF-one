name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install local build dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Run app self-test from source
        env:
          QT_QPA_PLATFORM: offscreen
        run: python src/main.py --self-test
      - name: Package standalone executable
        run: >-
          pyinstaller --noconfirm --clean --windowed --onefile
          --name NorthstarPDF
          --paths src
          --collect-all pymupdf
          --hidden-import PySide6.QtTest
          src/main.py
      - name: Smoke test packaged executable
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        # A windowed executable does not block PowerShell or report its exit
        # code unless it is started with -Wait -PassThru.
        run: |
          $report = Join-Path $env:RUNNER_TEMP "northstar-self-test.txt"
          $env:NORTHSTAR_SELF_TEST_REPORT = $report
          $process = Start-Process -FilePath .\dist\NorthstarPDF.exe -ArgumentList "--self-test" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { throw "Packaged self-test failed with exit code $($process.ExitCode)" }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: NorthstarPDF-Windows
          path: dist/NorthstarPDF.exe
          if-no-files-found: error
          retention-days: 30
