name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install local build dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Run offline guard tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Package standalone executable
        run: >-
          pyinstaller --noconfirm --clean --windowed --onefile
          --name NorthstarPDF
          --collect-all PySide6.QtPdf
          --collect-all PySide6.QtPdfWidgets
          --collect-all cryptography
          --collect-all pymupdf
          --hidden-import fitz
          --hidden-import PySide6.QtPdf
          --hidden-import PySide6.QtPdfWidgets
          src/main.py
      - name: Smoke test packaged executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\dist\NorthstarPDF.exe --self-test
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: NorthstarPDF-Windows
          path: dist/NorthstarPDF.exe
          if-no-files-found: error
          retention-days: 30
